<mat-card appearance="outlined" class="auth-card">
    <mat-card-header>
        <mat-card-title>Crear cuenta</mat-card-title>
        <mat-card-subtitle>Regístrate para empezar a usar Canopus</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <div class="register-panel">
            <p class="helper-text">Próximamente podrás completar el registro desde aquí.</p>
            <p class="helper-text muted">Mientras tanto, puedes volver a iniciar sesión y continuar con tu trabajo.</p>
        </div>
    </mat-card-content>

    <mat-card-footer>
        <a mat-stroked-button color="primary" routerLink="/auth/login">Volver al inicio de sesión</a>
    </mat-card-footer>
</mat-card>
