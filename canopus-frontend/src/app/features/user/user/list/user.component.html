<mat-card class="list-card">
  <mat-card-header class="card-header">
    <div class="header-copy">
      <mat-card-title>Usuarios</mat-card-title>
      <mat-card-subtitle>Gestión de usuarios y su actividad</mat-card-subtitle>
    </div>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="users()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>
        <ng-container matColumnDef="lastname">
          <th mat-header-cell *matHeaderCellDef> Lastname </th>
          <td mat-cell *matCellDef="let element"> {{element.lastname}} </td>
        </ng-container>  
        <ng-container matColumnDef="countProducts">
          <th mat-header-cell *matHeaderCellDef> Products </th>
          <td mat-cell *matCellDef="let element"> {{element.countProducts}} </td>
        </ng-container> 
        <ng-container matColumnDef="time">
          <th mat-header-cell *matHeaderCellDef> Time </th>
          <td mat-cell *matCellDef="let element"> {{element.time}} </td>
        </ng-container>   
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row
          (click)="edit(row.id)"
          *matRowDef="let row; columns: displayedColumns;">
        </tr>
    </table>
    @if (!isLoading() && errorMessage()) {
      <p role="alert">{{ errorMessage() }}</p>
    }
    <mat-paginator
      [length]="totalUsers"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 25, 50]"
      (page)="changePage($event)"
      aria-label="Paginación de usuarios">
    </mat-paginator>
  </mat-card-content>  
  <mat-card-actions>
    <button mat-raised-button (click)="create()">
      Create
    </button>
  </mat-card-actions>
</mat-card>
